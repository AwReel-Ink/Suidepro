<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Suidepro — Suivi de production</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2937">
<meta name="application-name" content="Suidepro">
<meta name="description" content="Suidepro — suivi de plusieurs lignes de production par listes de tâches.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
try{var t=localStorage.getItem('suidepro-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
:root{
  --bg:#EEF1F5; --panel:#fff; --text:#1F2937; --muted:#6B7280; --faint:#9CA3AF; --line:#E5E7EB; --line2:#CDD3DA;
  --hover:#F3F4F6; --task:#F9FAFB; --input:#FAFBFC; --done:#fff; --p0:#D7DCE2;
  --p1bg:#FFF8E6; --p2bg:#FEF0F0; --header:#1F2937; --pop:#fff; --kbd:#fff; --kbdline:#D1D5DB;
  --today-fg:#B45309; --late-fg:#DC2626;
  --accent:#2563EB; --imp:#F59E0B; --urg:#EF4444; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121419; --panel:#1C1F26; --text:#E6E8EC; --muted:#9AA1AD; --faint:#6B7280; --line:#2B2F38; --line2:#3A3F4A;
  --hover:#2A2E37; --task:#242830; --input:#181B21; --done:#1C1F26; --p0:#3A3F4A;
  --p1bg:rgba(245,158,11,.13); --p2bg:rgba(239,68,68,.15); --header:#0B0D11; --pop:#252932; --kbd:#2A2E37; --kbdline:#3F4550;
  --today-fg:#FBBF24; --late-fg:#F87171;
  --accent:#3B82F6; --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:14px;transition:background .2s}
button{font:inherit}
kbd{display:inline-block;font:600 11px/1 ui-monospace,Consolas,monospace;padding:3px 6px;border-radius:5px;background:var(--kbd);border:1px solid var(--kbdline);border-bottom-width:2px;color:var(--text);white-space:nowrap}

/* ---------- En-tête ---------- */
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--header);color:#fff;flex:none;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-right:10px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font-weight:500;color:#9CA3AF;margin-left:4px}
#tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;color:#CBD5E1;padding:8px 16px;border-radius:7px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;transition:background .15s,color .15s}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab.active{background:#fff;color:#111827}
.tab .badge{font-size:11px;min-width:20px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.16);text-align:center}
.tab.active .badge{background:#E5E7EB}
.tab .badge.hot{background:var(--urg);color:#fff}
.tab.drop{outline:2px dashed #fff;outline-offset:2px;background:rgba(255,255,255,.2);color:#fff}
.hbtn{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;background:rgba(255,255,255,.1);color:#E5E7EB;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.primary{background:var(--accent);color:#fff}
.hbtn.primary:hover{filter:brightness(.9)}
.hbtn.icon{padding:8px 10px}
.hbtn svg{width:17px;height:17px}
.spacer{flex:1}
#saveState{font-size:12px;color:#9CA3AF;min-width:95px;text-align:right;transition:color .3s}
#saveState.ok{color:#6EE7B7}
#saveState.err{color:#FCA5A5}

/* ---------- Bulles d'onglets ---------- */
.tab{padding:7px 10px 7px 14px}
.bubbles{display:flex;gap:3px}
.bub{font-size:11px;font-weight:700;min-width:20px;height:19px;padding:0 6px;border-radius:10px;display:grid;place-items:center;color:#fff;line-height:1}
.bub.r{background:var(--urg)} .bub.o{background:var(--imp)}
.bub.g{background:rgba(255,255,255,.2);color:#E5E7EB}
.tab.active .bub.g{background:#E5E7EB;color:#374151}
.bub.zero{opacity:.45}
/* ---------- Cloche ---------- */
#btnBell{position:relative}
#bellBadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--urg);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--header)}
#bellBadge[hidden]{display:none}
#btnBell.ringing svg{animation:ring 1.2s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
/* ---------- Pied de page ---------- */
footer{flex:none;text-align:center;font-size:11.5px;color:var(--faint);padding:5px 10px 7px;position:relative;z-index:1}

/* ---------- Guide en fond d'écran ---------- */
#bgGuide{position:fixed;right:22px;bottom:36px;z-index:0;width:390px;color:var(--muted);pointer-events:none;user-select:none}
#bgGuide h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.grow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.grow b{font-weight:600;color:var(--text);opacity:.8}
.grow .how{text-align:right;display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
#bgGuide .foot{margin-top:8px;font-size:12px;color:var(--faint)}

/* ---------- Tableau ---------- */
main{flex:1;display:flex;gap:16px;padding:18px;overflow-x:auto;overflow-y:hidden;align-items:flex-start;position:relative;z-index:1}
.col{flex:0 0 300px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);border-radius:var(--radius);
  box-shadow:var(--shadow);border-top:7px solid var(--c);overflow:hidden}
.col.dragging{opacity:.35}
.col-head{display:flex;align-items:center;gap:4px;padding:8px 8px 4px 4px;cursor:grab}
.grip{color:var(--faint);padding:4px 2px;user-select:none;font-size:15px;line-height:1}
.col-title{flex:1;font-weight:700;font-size:15px;padding:4px 6px;border-radius:6px;outline:none;word-break:break-word;min-width:20px}
.col-title:hover{background:var(--hover)}
.col-title:focus{background:var(--panel);box-shadow:0 0 0 2px var(--c);cursor:text}
.ibtn{width:28px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.danger:hover{background:rgba(239,68,68,.14);color:var(--urg)}
.ibtn svg{width:16px;height:16px}
.swatch{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.stats{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.progress{flex:1;height:5px;background:var(--hover);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--c);transition:width .3s}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.add{margin:0 10px 10px;padding:9px 10px;border:1px dashed var(--line2);border-radius:8px;font:inherit;outline:none;background:var(--input);color:var(--text)}
.add::placeholder{color:var(--faint)}
.add:hover{border-color:var(--c)}
.add:focus{border:1px solid var(--c);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.body{overflow-y:auto;padding:0 10px 10px;flex:1;min-height:30px}
.tasks{display:flex;flex-direction:column;gap:6px;min-height:6px}
.hint{font-size:12px;color:var(--faint);text-align:center;padding:10px 4px}

/* ---------- Tâches ---------- */
.task{display:flex;align-items:flex-start;gap:8px;padding:8px 6px 8px 8px;border-radius:8px;background:var(--task);border:1px solid var(--line);
  border-left:4px solid var(--p0);cursor:grab;transition:background .15s,opacity .2s,transform .2s}
.task:hover{border-color:var(--line2)}
.task.p1{border-left-color:var(--imp);background:var(--p1bg)}
.task.p2{border-left-color:var(--urg);background:var(--p2bg)}
.task.dragging{opacity:.3}
.task.checking{opacity:.4;transform:translateX(6px)}
.task input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--c);cursor:pointer;flex:none}
.prio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);background:var(--panel);cursor:pointer;flex:none;margin-top:1px;padding:0;transition:transform .1s}
.prio:hover{transform:scale(1.15)}
.p1 .prio{background:var(--imp);border-color:var(--imp)}
.p2 .prio{background:var(--urg);border-color:var(--urg)}
.text{flex:1;line-height:1.4;word-break:break-word;outline:none;cursor:text;min-height:20px;white-space:pre-wrap;padding:0 2px;border-radius:4px}
.text:hover{background:rgba(127,127,127,.08)}
.text[contenteditable="true"],.text[contenteditable="plaintext-only"]{background:var(--panel);box-shadow:0 0 0 2px var(--c);cursor:text}
.task .ibtn{width:22px;height:22px;opacity:0}
.task:hover .ibtn{opacity:1}
.task .ibtn svg{width:13px;height:13px}
.task.done{background:var(--done);cursor:default;border-left-color:var(--line)}
.task.done .text{text-decoration:line-through;color:var(--faint);cursor:default}
.task.done .text:hover{background:none}
.placeholder{height:36px;border-radius:8px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);flex:none}

.done-head{display:flex;align-items:center;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.done-toggle{flex:1;text-align:left;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:6px 2px;border-radius:6px;font-size:13px}
.done-toggle:hover{color:var(--text)}
.done-toggle .chev{display:inline-block;width:14px;transition:transform .15s}
.done-toggle.open .chev{transform:rotate(90deg)}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px}
.linkbtn:hover{background:rgba(239,68,68,.14);color:var(--urg)}
.donelist{display:flex;flex-direction:column;gap:4px;margin-top:4px}

.addcol{flex:0 0 240px;height:110px;border:2px dashed var(--line2);border-radius:var(--radius);background:transparent;color:var(--muted);font-weight:600;cursor:pointer;font-size:15px}
.addcol:hover{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.05)}
.empty{margin:12vh 0 0 6vw;color:var(--muted);max-width:420px}
.empty h2{color:var(--text);font-size:20px;margin:0 0 8px}
.empty p{margin:0 0 18px;line-height:1.5}
.bigbtn{border:0;border-radius:10px;padding:12px 22px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.bigbtn:hover{filter:brightness(.9)}

/* ---------- Dates ---------- */
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{align-self:flex-start;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--muted);border:0;cursor:pointer;line-height:18px}
.chip:hover{filter:brightness(.95)}
.chip svg{width:12px;height:12px;flex:none}
.chip.today{background:rgba(245,158,11,.18);color:var(--today-fg)}
.chip.late{background:rgba(239,68,68,.15);color:var(--late-fg)}
.chip.ring{background:var(--urg);color:#fff}
.task.done .chip{background:transparent;color:var(--faint);cursor:default;padding-left:0}
.task.flash{animation:flash .7s ease-in-out 3}
@keyframes flash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px var(--c)}}
#datepop{position:fixed;display:none;z-index:55;background:var(--pop);color:var(--text);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:14px;width:290px}
#datepop.open{display:block}
#datepop label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:10px}
#datepop label small{font-weight:400}
#datepop input,#datepop select{display:block;width:100%;margin-top:4px;padding:7px 8px;border-radius:7px;border:1px solid var(--line2);background:var(--input);color:var(--text);font:inherit}
.dp-quick{display:flex;gap:5px;flex-wrap:wrap}
.dp-quick button{border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.dp-quick button:hover{border-color:var(--accent);color:var(--accent)}
.dp-note{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.bigbtn.small{padding:7px 18px;font-size:14px}
/* ---------- Panneau des échéances ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:92vw;background:var(--panel);color:var(--text);box-shadow:-10px 0 34px rgba(0,0,0,.2);
  transform:translateX(105%);transition:transform .22s ease;z-index:45;display:flex;flex-direction:column}
#drawer.open{transform:none}
.dr-head{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.dr-head h2{flex:1;margin:0;font-size:17px}
.dr-body{flex:1;overflow-y:auto;padding:6px 12px 16px}
.dr-body h4{margin:14px 4px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);display:flex;gap:6px;align-items:center}
.dr-body h4.r{color:var(--urg)} .dr-body h4.o{color:var(--today-fg)}
.ditem{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:9px;cursor:pointer;border-left:4px solid var(--c)}
.ditem:hover{background:var(--hover)}
.ditem .dmain{flex:1;min-width:0}
.ditem .dt{font-weight:600;word-break:break-word}
.ditem .ds{font-size:12px;color:var(--muted);margin-top:2px}
.ditem .ack{border:0;background:var(--urg);color:#fff;border-radius:7px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer;flex:none}
.ditem .ack:hover{filter:brightness(.9)}
.dr-empty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.5}
.dr-foot{border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted)}
.dr-foot button{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;font-weight:600;padding:0}
/* ---------- Options ---------- */
.opt{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.opt .od{flex:1}
.opt .od b{display:block}
.opt .od span{font-size:13px;color:var(--muted)}
.opt .od span.warn{color:var(--late-fg)}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.obtn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.obtn:hover{border-color:var(--accent);color:var(--accent)}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}

/* ---------- Palette, toast, fenêtres ---------- */
.pop{position:fixed;display:none;background:var(--pop);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:8px;gap:6px;z-index:50;grid-template-columns:repeat(4,28px)}
.pop.open{display:grid}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--pop);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.sw.on,.sw:hover{box-shadow:0 0 0 2px var(--text)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 12px 10px 16px;border-radius:10px;
  display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:#374151;color:#93C5FD;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer}
#toast button:hover{background:#4B5563}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;place-items:center;z-index:70}
.modal.open{display:grid}
.modal .card{background:var(--panel);color:var(--text);border-radius:14px;width:min(560px,92vw);max-height:86vh;overflow:auto;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px;font-size:19px}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal h4{margin:16px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.modal .grow{font-size:14px;padding:7px 0}
.modal .grow b{opacity:1}
.modal .grow span.d{color:var(--muted);font-size:13px}
.modal .close{float:right}
.legend{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#374151"/><rect x="5" y="5" width="6" height="21" rx="1.5" fill="#fff"/><rect x="5" y="5" width="6" height="3" fill="#3B82F6"/><rect x="13" y="5" width="6" height="15" rx="1.5" fill="#fff"/><rect x="13" y="5" width="6" height="3" fill="#F59E0B"/><rect x="21" y="5" width="6" height="18" rx="1.5" fill="#fff"/><rect x="21" y="5" width="6" height="3" fill="#10B981"/></svg>
    <span>Suidepro <small>Suivi de production</small></span>
  </div>
  <nav id="tabs"></nav>
  <button id="addList" class="hbtn primary" title="Nouvelle liste (Alt+N)">+ Nouvelle liste</button>
  <div class="spacer"></div>
  <span id="saveState"></span>
  <button id="btnBell" class="hbtn icon" title="Échéances et rappels"></button>
  <button id="btnGuide" class="hbtn" title="Guide des fonctions et raccourcis (F1 ou ?)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M7.7 7.6a2.4 2.4 0 1 1 3.3 2.2c-.6.3-1 .8-1 1.5v.4"/><circle cx="10" cy="14.6" r=".4" fill="currentColor"/></svg>Guide</button>
  <button id="btnTheme" class="hbtn icon" title="Basculer thème clair / sombre"></button>
  <button id="btnOptions" class="hbtn icon" title="Options (notifications, thème, sauvegarde)"></button>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</header>
<main id="board"></main>
<footer id="footer"></footer>
<div id="palette" class="pop"></div>
<div id="toast"></div>
<aside id="bgGuide" aria-hidden="true"></aside>
<div id="guide" class="modal" role="dialog" aria-modal="true" aria-label="Guide"><div class="card"></div></div>
<div id="options" class="modal" role="dialog" aria-modal="true" aria-label="Options"><div class="card"></div></div>
<div id="datepop"></div>
<aside id="drawer" aria-label="Échéances"></aside>

<script>
(() => {
'use strict';

/* ============ Constantes ============ */
const TABS = [
  { id: 'production', label: 'Production' },
  { id: 'social',     label: 'Social' },
  { id: 'todo',       label: 'À faire' }
];
const COLORS = ['#3B82F6','#F59E0B','#10B981','#8B5CF6','#EC4899','#14B8A6','#EF4444','#64748B'];
const PRIO = ['Normale', 'Importante', 'Urgente'];
const APP_VERSION = '01.00';
const AUTHOR = 'Leroy Aurélien';
const REMINDERS = [[null, 'Aucun rappel'], [0, "À l'heure prévue"], [15, '15 min avant'], [60, '1 h avant'], [1440, 'La veille'], [2880, '2 jours avant'], [10080, '1 semaine avant']];
const DEFAULT_HOUR = '08:00'; // heure utilisée pour les rappels d'une date sans heure
const ICON = {
  bell:  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.6 5.5 1.6 5.5H3.4S5 12 5 8z"/><path d="M8.3 16.5a1.8 1.8 0 0 0 3.4 0"/></svg>',

  trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg>',
  x:     '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>'
};

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isEditing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.isContentEditable); };
function makeEditable(node) {
  node.contentEditable = 'plaintext-only';
  if (node.contentEditable !== 'plaintext-only') node.contentEditable = 'true';
  node.spellcheck = true;
}
function caretEnd(node, selectAll) {
  const r = document.createRange(); r.selectNodeContents(node); if (!selectAll) r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

const board = $('#board'), tabsEl = $('#tabs'), pal = $('#palette'), toastEl = $('#toast'), saveEl = $('#saveState');
let state, db, drag = null, focusAfter = null, undoSnap = null, toastTimer, saveTimer, savePending = false;
const ph = el('div', 'placeholder');
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('suivi-production') : null;

/* ============ Données ============ */
const mkList = (title, i) => ({ id: uid(), title, color: COLORS[i % COLORS.length], showDone: false, tasks: [] });
const defaultState = () => ({ v: 1, activeTab: 'production', tabs: { production: [mkList('Ligne 1', 0)], social: [], todo: [] } });
function normalize(s) {
  if (!s || typeof s !== 'object' || !s.tabs) s = defaultState();
  TABS.forEach(t => { if (!Array.isArray(s.tabs[t.id])) s.tabs[t.id] = []; });
  if (!TABS.some(t => t.id === s.activeTab)) s.activeTab = 'production';
  Object.values(s.tabs).forEach(arr => arr.forEach(l => {
    l.id ||= uid(); l.title ??= 'Sans titre'; l.color ||= COLORS[0]; l.showDone = !!l.showDone;
    l.tasks = Array.isArray(l.tasks) ? l.tasks : [];
    l.tasks.forEach(t => {
      t.id ||= uid(); t.text = String(t.text ?? ''); t.done = !!t.done; t.prio = [0,1,2].includes(t.prio) ? t.prio : 0;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(t.due || '')) { delete t.due; delete t.time; t.remind = null; }
      if (!/^\d{2}:\d{2}$/.test(t.time || '')) delete t.time;
      t.remind = REMINDERS.some(x => x[0] === t.remind) ? t.remind : null;
    });
  }));
  s.settings = Object.assign({ notify: true, tips: true }, s.settings || {});
  return s;
}
const curLists = () => state.tabs[state.activeTab];
function findList(id) {
  for (const k in state.tabs) { const l = state.tabs[k].find(x => x.id === id); if (l) return { list: l, tab: k }; }
  return {};
}
const openTasks = l => l.tasks.filter(t => !t.done);
function insertOpen(list, task, idx) {
  const open = openTasks(list);
  if (idx == null || idx >= open.length) {
    const last = open[open.length - 1];
    list.tasks.splice(last ? list.tasks.indexOf(last) + 1 : 0, 0, task);
  } else list.tasks.splice(list.tasks.indexOf(open[idx]), 0, task);
}

/* ============ IndexedDB ============ */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('suivi-production', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbGet() {
  return new Promise(res => {
    const q = db.transaction('kv').objectStore('kv').get('state');
    q.onsuccess = () => res(q.result); q.onerror = () => res(null);
  });
}
function writeNow() {
  clearTimeout(saveTimer); savePending = false;
  if (!db) return;
  try {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(JSON.parse(JSON.stringify(state)), 'state');
    tx.oncomplete = () => { saveEl.textContent = '✓ Enregistré'; saveEl.className = 'ok'; bc && bc.postMessage('saved');
      setTimeout(() => { saveEl.className = ''; }, 1200); };
    tx.onerror = () => { saveEl.textContent = '⚠ Erreur d\'enregistrement'; saveEl.className = 'err'; };
  } catch (e) { saveEl.textContent = '⚠ Erreur d\'enregistrement'; saveEl.className = 'err'; }
}
function save() { savePending = true; clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 200); }
function commit() { save(); render(); }
document.addEventListener('visibilitychange', () => { if (document.hidden && savePending) writeNow(); });
window.addEventListener('pagehide', () => { if (savePending) writeNow(); });
if (bc) bc.onmessage = async () => { if (isEditing() || drag) return; const s = await dbGet(); if (s) { state = normalize(s); if (state.theme) applyTheme(state.theme); renderGuides(); render(); } };

/* ============ Annulation & toast ============ */
function snapshot() { undoSnap = JSON.stringify(state); }
function undo() {
  if (!undoSnap) return;
  state = JSON.parse(undoSnap); undoSnap = null; hideToast(); commit();
}
function toast(msg, withUndo) {
  toastEl.innerHTML = ''; toastEl.append(el('span', '', '')); toastEl.firstChild.textContent = msg;
  if (withUndo) { const b = el('button', '', 'Annuler'); b.onclick = undo; toastEl.append(b); }
  toastEl.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, withUndo ? 7000 : 2500);
}
function hideToast() { toastEl.classList.remove('show'); }

/* ============ Actions ============ */
function newList() {
  const lists = curLists();
  const used = new Set(lists.map(l => l.color));
  const l = mkList('Nouvelle liste', lists.length);
  l.color = COLORS.find(c => !used.has(c)) || l.color;
  lists.push(l);
  focusAfter = { sel: `.col[data-id="${l.id}"] .col-title`, selectAll: true };
  commit();
  requestAnimationFrame(() => { board.scrollLeft = board.scrollWidth; });
}
function deleteList(l) {
  snapshot();
  const arr = curLists(); arr.splice(arr.indexOf(l), 1);
  commit(); toast(`Liste « ${l.title} » supprimée`, true);
}
function addTask(l, raw) {
  let text = raw.trim(), prio = 0;
  if (text.startsWith('!!')) { prio = 2; text = text.slice(2).trim(); }
  else if (text.startsWith('!')) { prio = 1; text = text.slice(1).trim(); }
  if (!text) return;
  insertOpen(l, { id: uid(), text, done: false, prio }, null);
  focusAfter = { sel: `.col[data-id="${l.id}"] .add` };
  commit();
}
function deleteTask(l, t) {
  snapshot(); l.tasks.splice(l.tasks.indexOf(t), 1); commit(); toast('Tâche supprimée', true);
}
function toggleDone(l, t, row) {
  if (!t.done) {
    row.classList.add('checking');
    setTimeout(() => { t.done = true; t.doneAt = Date.now(); commit(); }, 220);
  } else {
    t.done = false; delete t.doneAt;
    l.tasks.splice(l.tasks.indexOf(t), 1); insertOpen(l, t, null); commit();
  }
}
function sortByPrio(l) {
  snapshot();
  const open = openTasks(l).map((t, i) => [t, i]).sort((a, b) => (b[0].prio - a[0].prio) || ((dueAt(a[0]) || Infinity) - (dueAt(b[0]) || Infinity)) || (a[1] - b[1])).map(x => x[0]);
  l.tasks = open.concat(l.tasks.filter(t => t.done));
  commit(); toast('Liste triée : urgent en haut, puis par date', true);
}
function clearDone(l) {
  const n = l.tasks.length - openTasks(l).length; if (!n) return;
  snapshot(); l.tasks = openTasks(l); commit();
  toast(`${n} tâche${n > 1 ? 's' : ''} terminée${n > 1 ? 's' : ''} effacée${n > 1 ? 's' : ''}`, true);
}
function moveTask(fromId, taskId, toId, idx) {
  const from = findList(fromId).list, to = findList(toId).list; if (!from || !to) return;
  const i = from.tasks.findIndex(t => t.id === taskId); if (i < 0) return;
  const [t] = from.tasks.splice(i, 1);
  insertOpen(to, t, idx); commit();
}
function moveListToTab(listId, tabId) {
  const { list, tab } = findList(listId); if (!list || tab === tabId) return;
  snapshot();
  state.tabs[tab].splice(state.tabs[tab].indexOf(list), 1);
  state.tabs[tabId].push(list);
  commit();
  toast(`« ${list.title} » déplacée vers ${TABS.find(t => t.id === tabId).label}`, true);
}

/* ============ Rendu ============ */
function render() { renderTabs(); renderBoard(); renderBell(); if (drawerEl.classList.contains('open')) renderDrawer(); }

function renderTabs() {
  tabsEl.innerHTML = '';
  TABS.forEach((t, i) => {
    const c = [0, 0, 0];
    state.tabs[t.id].forEach(l => l.tasks.forEach(x => { if (!x.done) c[x.prio]++; }));
    const b = el('button', 'tab' + (state.activeTab === t.id ? ' active' : ''));
    b.innerHTML = `<span></span><span class="bubbles"><span class="bub r${c[2] ? '' : ' zero'}">${c[2]}</span><span class="bub o${c[1] ? '' : ' zero'}">${c[1]}</span><span class="bub g">${c[0]}</span></span>`;
    b.firstChild.textContent = t.label;
    b.title = `${t.label} (Ctrl+${i + 1})\n● ${c[2]} urgente(s)\n● ${c[1]} importante(s)\n● ${c[0]} normale(s)`;
    b.onclick = () => { if (state.activeTab !== t.id) { state.activeTab = t.id; commit(); } };
    // déposer une liste sur un onglet = la déplacer dans cet onglet
    b.addEventListener('dragover', e => {
      if (drag && drag.type === 'list' && t.id !== state.activeTab) { e.preventDefault(); b.classList.add('drop'); }
    });
    b.addEventListener('dragleave', () => b.classList.remove('drop'));
    b.addEventListener('drop', e => {
      if (!drag || drag.type !== 'list') return;
      e.preventDefault(); b.classList.remove('drop');
      const id = drag.listId; drag = null; moveListToTab(id, t.id);
    });
    tabsEl.append(b);
  });
}

function renderBoard() {
  const scroll = board.scrollLeft;
  board.innerHTML = '';
  const lists = curLists();
  if (!lists.length) {
    const tab = TABS.find(t => t.id === state.activeTab).label;
    const e = el('div', 'empty', `<h2>Aucune liste dans « ${tab} »</h2><p>Créez une liste par ligne de production ou par sujet à suivre. Vous pourrez ensuite les réorganiser par glisser-déposer.</p>`);
    const b = el('button', 'bigbtn', '+ Créer une liste'); b.onclick = newList; e.append(b);
    board.append(e); return;
  }
  lists.forEach(l => board.append(renderList(l)));
  const add = el('button', 'addcol', '+ Nouvelle liste'); add.onclick = newList; board.append(add);
  board.scrollLeft = scroll;
  if (focusAfter) {
    const f = board.querySelector(focusAfter.sel);
    if (f) { if (f._edit) f._edit(focusAfter.selectAll); else f.focus(); }
    focusAfter = null;
  }
}

function renderList(l) {
  const col = el('section', 'col'); col.dataset.id = l.id; col.style.setProperty('--c', l.color);

  /* --- En-tête --- */
  const head = el('div', 'col-head');
  head.title = 'Glisser pour déplacer la liste (ou la déposer sur un onglet)';
  head.append(el('span', 'grip', '⠿'));
  const title = el('div', 'col-title'); title.textContent = l.title;
  title.title = 'Cliquer pour renommer · glisser pour déplacer';
  title._edit = selectAll => {
    if (title.isContentEditable) return;
    const orig = l.title;
    makeEditable(title); title.spellcheck = false; title.focus(); caretEnd(title, selectAll);
    title.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); title.blur(); col.querySelector('.add').focus(); }
      if (e.key === 'Escape') { title.textContent = orig; title.blur(); }
    };
    title.onblur = () => {
      title.contentEditable = 'false'; title.onblur = title.onkeydown = null;
      const v = title.textContent.trim() || 'Sans titre';
      title.textContent = v; if (v !== l.title) { l.title = v; save(); }
    };
  };
  title.onclick = () => title._edit(false);
  const colorBtn = el('button', 'ibtn colorbtn', '<span class="swatch"></span>'); colorBtn.title = 'Changer la couleur';
  colorBtn.onclick = e => { e.stopPropagation(); pal.classList.contains('open') && pal.dataset.for === l.id ? closePal() : openPal(colorBtn, l); };
  const sortBtn = el('button', 'ibtn', ICON.sort); sortBtn.title = 'Trier par priorité (urgent en haut)';
  sortBtn.onclick = () => sortByPrio(l);
  const delBtn = el('button', 'ibtn danger', ICON.trash); delBtn.title = 'Supprimer la liste (annulable)';
  delBtn.onclick = () => deleteList(l);
  head.append(title, colorBtn, sortBtn, delBtn);

  // glisser la colonne depuis l'en-tête (hors titre/boutons)
  head.addEventListener('mousedown', e => { if (!e.target.closest('.ibtn') && !title.isContentEditable) col.draggable = true; });
  head.addEventListener('mouseup', () => { col.draggable = false; });
  col.addEventListener('dragstart', e => {
    if (e.target !== col) return;
    closePal();
    drag = { type: 'list', listId: l.id, el: col };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', l.title);
    requestAnimationFrame(() => col.classList.add('dragging'));
  });
  col.addEventListener('dragend', e => {
    if (e.target !== col) return;
    col.draggable = false; col.classList.remove('dragging');
    document.querySelectorAll('.tab.drop').forEach(t => t.classList.remove('drop'));
    if (drag && drag.type === 'list') {
      const ids = [...board.querySelectorAll('.col')].map(c => c.dataset.id);
      curLists().sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      drag = null; commit();
    }
  });

  /* --- Progression --- */
  const total = l.tasks.length, done = total - openTasks(l).length;
  const stats = el('div', 'stats', `<div class="progress"><i style="width:${total ? done / total * 100 : 0}%"></i></div><span class="meta">${done}/${total}</span>`);

  /* --- Saisie rapide --- */
  const add = el('input', 'add'); add.placeholder = '+ Ajouter une tâche… (Entrée)';
  add.title = 'Astuce : commencer par « ! » = importante, « !! » = urgente';
  add.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTask(l, add.value); }
    if (e.key === 'Escape') { add.value = ''; add.blur(); }
  });

  /* --- Tâches --- */
  const body = el('div', 'body');
  const zone = el('div', 'tasks');
  const open = openTasks(l);
  open.forEach(t => zone.append(renderTask(l, t)));
  body.append(zone);
  if (!total) body.append(el('div', 'hint', 'Liste vide — tapez une tâche ci-dessus ou glissez-en une ici.'));

  const doneTasks = l.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  if (doneTasks.length) {
    const dh = el('div', 'done-head');
    const tg = el('button', 'done-toggle' + (l.showDone ? ' open' : ''), `<span class="chev">▸</span> Terminées (${doneTasks.length})`);
    tg.onclick = () => { l.showDone = !l.showDone; commit(); };
    const clr = el('button', 'linkbtn', 'Effacer'); clr.title = 'Effacer toutes les tâches terminées (annulable)';
    clr.onclick = () => clearDone(l);
    dh.append(tg, clr); body.append(dh);
    if (l.showDone) {
      const dl = el('div', 'donelist');
      doneTasks.forEach(t => dl.append(renderTask(l, t)));
      body.append(dl);
    }
  }

  // dépôt de tâches n'importe où dans la colonne
  col.addEventListener('dragover', e => {
    if (!drag || drag.type !== 'task') return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    placePh(zone, e.clientY);
  });
  col.addEventListener('drop', e => {
    if (!drag || drag.type !== 'task') return;
    e.preventDefault();
    const idx = phIndex(zone); ph.remove();
    const d = drag; drag = null;
    moveTask(d.listId, d.taskId, l.id, idx);
  });

  col.append(head, stats, add, body);
  return col;
}

function renderTask(l, t) {
  const row = el('div', 'task p' + t.prio + (t.done ? ' done' : ''));
  row.draggable = !t.done; row.dataset.id = t.id;

  const cb = el('input'); cb.type = 'checkbox'; cb.checked = t.done;
  cb.title = t.done ? 'Remettre en cours' : 'Marquer comme terminée';
  cb.onchange = () => toggleDone(l, t, row);

  const pr = el('button', 'prio'); pr.title = `Priorité : ${PRIO[t.prio]} — cliquer pour changer`;
  pr.onclick = () => { t.prio = (t.prio + 1) % 3; commit(); };

  const main = el('div', 'tmain');
  const tx = el('div', 'text'); tx.textContent = t.text;
  if (!t.done) { tx.title = 'Cliquer pour modifier'; tx.onclick = () => startEdit(l, t, row, tx); }
  main.append(tx);
  if (t.due) {
    const chip = el('button', 'chip ' + (t.done ? '' : isRinging(t) ? 'ring' : dueState(t)));
    chip.innerHTML = ICON.cal + '<span></span>' + (t.remind != null && !t.done ? ICON.bell : '');
    chip.querySelector('span').textContent = fmtDue(t);
    chip.title = t.done ? '' : 'Modifier la date / le rappel' + (t.remind != null ? `\nRappel : ${remindLabel(t)}` : '');
    chip.onclick = e => { e.stopPropagation(); if (!t.done) openDatePop(chip, l, t); };
    main.append(chip);
  }

  const del = el('button', 'ibtn danger', ICON.x); del.title = 'Supprimer (annulable)';
  del.onclick = () => deleteTask(l, t);

  if (t.done) row.append(cb, main, del);
  else {
    const calBtn = el('button', 'ibtn calbtn', ICON.cal); calBtn.title = 'Date et rappel';
    calBtn.onclick = e => { e.stopPropagation(); openDatePop(calBtn, l, t); };
    row.append(cb, pr, main, calBtn, del);
  }

  row.addEventListener('dragstart', e => {
    if (tx.isContentEditable) { e.preventDefault(); return; }
    closePal(); closeDatePop();
    drag = { type: 'task', listId: l.id, taskId: t.id };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', t.text);
    requestAnimationFrame(() => row.classList.add('dragging'));
  });
  row.addEventListener('dragend', () => { row.classList.remove('dragging'); ph.remove(); drag = null; });
  return row;
}

function startEdit(l, t, row, tx) {
  if (tx.isContentEditable) return;
  const orig = t.text;
  row.draggable = false; makeEditable(tx); tx.focus(); caretEnd(tx);
  tx.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); tx.blur(); }
    if (e.key === 'Escape') { tx.textContent = orig; tx.blur(); }
  };
  tx.onblur = () => {
    tx.contentEditable = 'false'; row.draggable = true; tx.onblur = tx.onkeydown = null;
    const v = tx.textContent.trim();
    if (!v) { deleteTask(l, t); return; }
    tx.textContent = v; if (v !== orig) { t.text = v; save(); }
  };
}

/* ============ Glisser-déposer : aides ============ */
function placePh(zone, y) {
  const items = [...zone.querySelectorAll('.task:not(.dragging)')];
  const after = items.find(it => { const r = it.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (after) { if (after.previousSibling !== ph) zone.insertBefore(ph, after); }
  else if (zone.lastChild !== ph) zone.append(ph);
}
function phIndex(zone) {
  let i = 0;
  for (const c of zone.children) {
    if (c === ph) return i;
    if (c.classList.contains('task') && !c.classList.contains('dragging')) i++;
  }
  return i;
}
// réordonner les colonnes en direct
board.addEventListener('dragover', e => {
  if (!drag || drag.type !== 'list') return;
  e.preventDefault();
  const src = drag.el;
  const cols = [...board.querySelectorAll('.col')].filter(c => c !== src);
  const after = cols.find(c => { const r = c.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
  const target = after || board.querySelector('.addcol');
  if (target && src.nextSibling !== target) board.insertBefore(src, target);
});
board.addEventListener('drop', e => { if (drag && drag.type === 'list') e.preventDefault(); });
// défilement automatique près des bords pendant un glisser
document.addEventListener('dragover', e => {
  if (!drag) return;
  const r = board.getBoundingClientRect();
  if (e.clientX < r.left + 70) board.scrollLeft -= 18;
  else if (e.clientX > r.right - 70) board.scrollLeft += 18;
});
// molette = défilement horizontal quand on n'est pas dans une liste qui défile
board.addEventListener('wheel', e => {
  const b = e.target.closest('.body');
  if (b && b.scrollHeight > b.clientHeight) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { board.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

function doExport() {

  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = `suidepro-${new Date().toISOString().slice(0, 10)}.json`;

$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !data.tabs) throw new Error();
    snapshot(); state = normalize(data); if (state.theme) applyTheme(state.theme); renderGuides(); commit(); closeModal('options');
    toast('Sauvegarde restaurée', true);
  } catch { toast('Fichier non reconnu'); }
};
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); $('#guide').classList.contains('open') ? closeGuide() : openGuide(); return; }
  if (e.key === 'Escape') {
    if (dpEl.classList.contains('open')) { closeDatePop(); return; }
    if ($('.modal.open')) { document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open')); return; }
    if (drawerEl.classList.contains('open')) { closeDrawer(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault(); if (document.activeElement) document.activeElement.blur();
    state.activeTab = TABS[+e.key - 1].id; commit(); return;
  }
  if (isEditing()) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && undoSnap) { e.preventDefault(); undo(); }
  if (e.key === '?') { e.preventDefault(); openGuide(); return; }
  if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newList(); }
});

/* ============ Dates ============ */
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function dueAt(t) {
  if (!t.due) return null;
  const d = parseDay(t.due); const [h, mi] = (t.time || DEFAULT_HOUR).split(':').map(Number); d.setHours(h, mi, 0, 0); return d;
}
function remindAt(t) { const d = dueAt(t); return d && t.remind != null ? new Date(d - t.remind * 60000) : null; }
function dayDiff(s) { const a = parseDay(s), b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 86400000); }
function fmtDay(s, long) {
  const n = dayDiff(s);
  if (n === 0) return "Aujourd'hui"; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
  return parseDay(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: long && Math.abs(n) > 300 ? 'numeric' : undefined });
}
function fmtDue(t) { return fmtDay(t.due) + (t.time ? ' · ' + t.time : ''); }
function remindLabel(t) {
  const r = remindAt(t); if (!r) return '';
  return `${REMINDERS.find(x => x[0] === t.remind)[1].toLowerCase()} — ${fmtDay(isoDay(r), true)} à ${pad(r.getHours())}:${pad(r.getMinutes())}`;
}
function dueState(t) {
  if (t.done || !t.due) return '';
  const n = dayDiff(t.due);
  if (n < 0 || (n === 0 && t.time && dueAt(t) < new Date())) return 'late';
  return n === 0 ? 'today' : '';
}
function isRinging(t) { if (t.done || t.remindAck) return false; const r = remindAt(t); return !!r && r <= new Date(); }
function* allTasks() { for (const tab of TABS) for (const l of state.tabs[tab.id]) for (const t of l.tasks) yield { t, l, tab }; }

  closePal();

  dpEl.innerHTML = `
    <div class="dp-quick"><button data-q="0">Aujourd'hui</button><button data-q="1">Demain</button><button data-q="mon">Lundi</button><button data-q="7">+1 semaine</button></div>
    <label>Date<input type="date" class="dp-date"></label>
    <label>Heure <small>(facultatif)</small><input type="time" class="dp-time"></label>
    <label>Rappel<select class="dp-rem">${REMINDERS.map(([v, n]) => `<option value="${v ?? ''}">${n}</option>`).join('')}</select></label>
    <div class="dp-note"></div>
    <div class="dp-foot"><button class="linkbtn dp-clear">Retirer la date</button><button class="bigbtn small dp-ok">OK</button></div>`;
  const dDate = dpEl.querySelector('.dp-date'), dTime = dpEl.querySelector('.dp-time'), dRem = dpEl.querySelector('.dp-rem'), note = dpEl.querySelector('.dp-note');
  dDate.value = t.due || ''; dTime.value = t.time || ''; dRem.value = t.remind ?? '';
  const showNote = () => {
    note.textContent = !t.due ? 'Choisissez une date.' : t.remind != null ? `🔔 Rappel ${remindLabel(t)}` : 'Pas de rappel : la date reste affichée sur la tâche.';
  };
  const apply = () => {
    if (!dDate.value) { delete t.due; delete t.time; t.remind = null; }
    else { t.due = dDate.value; if (dTime.value) t.time = dTime.value; else delete t.time; t.remind = dRem.value === '' ? null : +dRem.value; }
    t.notified = false; t.remindAck = false;
    if (t.remind != null) askNotifPermission();

    if (q === 'mon') d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7)); else d.setDate(d.getDate() + +q);

  dpEl.querySelectorAll('input,select').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); closeDatePop(); } });
  dpEl.querySelector('.dp-clear').onclick = () => { dDate.value = ''; apply(); closeDatePop(); };
  dpEl.querySelector('.dp-ok').onclick = closeDatePop;
  showNote();
  dpEl.classList.add('open');
  const r = anchor.getBoundingClientRect(), h = dpEl.offsetHeight, w = dpEl.offsetWidth;

  if (!t.due) dDate.focus();
}

const drawerEl = $('#drawer');

function renderBell() {
  let n = 0; for (const { t } of allTasks()) if (isRinging(t)) n++;
  const badge = $('#bellBadge'); badge.textContent = n; badge.hidden = !n;
  $('#btnBell').title = n ? `${n} rappel(s) — voir les échéances` : 'Échéances et rappels';
  document.title = (n ? `(${n}) ` : '') + 'Suidepro — Suivi de production';
}
function goToTask(id) {
  for (const { t, l, tab } of allTasks()) if (t.id === id) {
    state.activeTab = tab.id; if (t.done) l.showDone = true;
    commit();
    requestAnimationFrame(() => {
      const row = board.querySelector(`.task[data-id="${id}"]`); if (!row) return;
      row.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 2200);
    });
    return;
  }
}
function renderDrawer() {
  const items = [...allTasks()].filter(x => !x.t.done && x.t.due).sort((a, b) => dueAt(a.t) - dueAt(b.t));
  const groups = [['ring', '🔔 Rappels', 'r'], ['late', 'En retard', 'r'], ['today', "Aujourd'hui", 'o'], ['tomorrow', 'Demain', ''], ['week', '7 prochains jours', ''], ['later', 'Plus tard', '']];
  const by = Object.fromEntries(groups.map(g => [g[0], []]));
  items.forEach(x => {
    const n = dayDiff(x.t.due), st = dueState(x.t);
    by[isRinging(x.t) ? 'ring' : st === 'late' ? 'late' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : n <= 7 ? 'week' : 'later'].push(x);
  });
  drawerEl.innerHTML = `<div class="dr-head"><h2>Échéances</h2><button class="ibtn" title="Fermer (Échap)">${ICON.x}</button></div><div class="dr-body"></div>
    <div class="dr-foot">Notifications Windows : <b>${state.settings.notify ? 'activées' : 'désactivées'}</b> — <button>Options</button></div>`;
  drawerEl.querySelector('.dr-head .ibtn').onclick = closeDrawer;
  drawerEl.querySelector('.dr-foot button').onclick = openOptions;
  const body = drawerEl.querySelector('.dr-body');
  if (!items.length) { body.innerHTML = `<div class="dr-empty">Aucune échéance.<br>Ajoutez une date à une tâche avec l'icône calendrier qui apparaît au survol.</div>`; return; }
  groups.forEach(([k, label, cls]) => {
    if (!by[k].length) return;
    body.append(el('h4', cls, `${label} (${by[k].length})`));
    by[k].forEach(({ t, l, tab }) => {
      const it = el('div', 'ditem'); it.style.setProperty('--c', l.color);
      it.innerHTML = `<div class="dmain"><div class="dt"></div><div class="ds"></div></div>`;
      it.querySelector('.dt').textContent = (t.prio === 2 ? '🔴 ' : t.prio === 1 ? '🟠 ' : '') + t.text;
      it.querySelector('.ds').textContent = `${fmtDue(t)} · ${tab.label} › ${l.title}`;
      it.title = 'Aller à la tâche';
      it.onclick = () => goToTask(t.id);
      if (k === 'ring') {
        const ack = el('button', 'ack', 'Vu'); ack.title = 'Arrêter ce rappel (la date reste)';
        ack.onclick = e => { e.stopPropagation(); t.remindAck = true; commit(); };
        it.append(ack);
      }
      body.append(it);
    });
  });
}

/* --- notifications Windows --- */
const notifSupported = () => 'Notification' in window && window.isSecureContext;
function askNotifPermission() {
  if (state.settings.notify && notifSupported() && Notification.permission === 'default')
    Notification.requestPermission().then(() => { if ($('#options').classList.contains('open')) renderOptions(); });
}
function notify(t, l, tab) {
  if (!state.settings.notify || !notifSupported() || Notification.permission !== 'granted') return;
  try {
    const n = new Notification('Suidepro — Rappel', { body: `${t.text}\n${fmtDue(t)} · ${tab.label} › ${l.title}`, icon: 'icons/icon-192.png', tag: t.id, silent: true });
    n.onclick = () => { window.focus(); goToTask(t.id); n.close(); };
  } catch {}
}
let lastSig = '';
function tick() {
  if (!state) return;
  let changed = false; const ring = [], late = [];
  for (const x of allTasks()) {
    if (isRinging(x.t)) { ring.push(x.t.id); if (!x.t.notified) { x.t.notified = true; changed = true; notify(x.t, x.l, x.tab); } }
    if (dueState(x.t) === 'late') late.push(x.t.id);
  }
  if (changed) { save(); $('#btnBell').classList.remove('ringing'); void $('#btnBell').offsetWidth; $('#btnBell').classList.add('ringing'); }
  const sig = isoDay(new Date()) + '|' + ring.join(',') + '|' + late.join(',');
  if (sig !== lastSig) {
    lastSig = sig;
    renderBell(); if (drawerEl.classList.contains('open')) renderDrawer();
    if (!isEditing() && !drag && !dpEl.classList.contains('open')) renderBoard();
  }
}

};

/* ============ Démarrage ============ */
(async function init() {
  try {
    db = await openDB();
    state = normalize(await dbGet());
  } catch (err) {
    state = defaultState();
    saveEl.textContent = '⚠ Stockage indisponible'; saveEl.className = 'err';
  }
  applyTheme(state.theme || document.documentElement.dataset.theme || 'light');
  renderGuides();
  render();
  tick(); setInterval(tick, 20000);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
